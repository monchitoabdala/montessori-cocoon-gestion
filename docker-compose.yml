services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion_escolar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: gestion_escolar
    ports:
      - "5432:5432"
    volumes:
      - gestion_escolar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d gestion_escolar"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gestion_escolar_pgdata:
